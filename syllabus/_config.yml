      planning_tabel: |
        | Weeknr | Datum      | Activiteit                                  | Fysiek/online | Tijdstip      |
        | :----: | :--------- | ------------------------------------------- | ------------- | ------------- |
        |   1    | 20-01-2026 | Kleine start                                | Online        | 14:30 - 16:00 |
        |   2    | 27-01-2026 | Grote start. Hier *moet* je bij zijn.       | Fysiek        | 14:30 - 17:00 |
        |   3    | 03-02-2026 | Weekly standup 1                            | Online        | 14:30 - 17:00 |
